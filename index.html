<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人英文單字學習本</title>
    <style>
        /* 專注力心理學色彩系統 (日系書房與森林色調) */
        :root {
            --bg-color: #faf8f5;          /* 暖燕麥色背景 */
            --container-bg: #fdfdfb;      /* 象牙白紙張感 */
            --primary-color: #2d5a27;     /* 森林深綠 (用於相似字) */
            --primary-hover: #1e3d17;
            --accent-color: #8c7ae6;      /* 溫和紫羅蘭 (用於關聯字) */
            --success-color: #3f6212;     /* 抹茶綠 */
            --success-hover: #2d4a0c;
            --warning-color: #b45309;     /* 橡木暖橙 (用於混淆字) */
            --warning-hover: #92400e;
            --danger-color: #991b1b;      /* 磚紅 */
            --danger-hover: #7f1d1d;
            
            --text-color: #24292f;        /* 沉穩炭灰 */
            --text-muted: #57606a;        /* 輔助灰色 */
            --border-color: #e1e4e6;      /* 溫和細邊框 */
            --shadow-subtle: 0 4px 20px rgba(45, 90, 39, 0.04);
        }

        /* 徹底解決寬高撐開、內邊距擠壓歪斜的黃金關鍵 */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .container {
            max-width: 1400px; /* 寬螢幕滿版體驗 */
            width: 100%;
            margin: 0 auto;
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--shadow-subtle);
            border: 1px solid var(--border-color);
            position: relative;
        }

        /* 頂部控制區 */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* 雲端同步狀態指示徽章 */
        #syncIndicator {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            display: none;
            letter-spacing: 0.5px;
        }
        .sync-badge-online {
            background-color: #eef0eb;
            color: var(--primary-color);
            border: 1px solid #cbd7c9;
        }
        .sync-badge-offline {
            background-color: #fee2e2;
            color: #ef4444;
            border: 1px solid #fca5a5;
        }

        .header-btn-group {
            display: flex;
            gap: 8px;
        }

        #loginBtn, #pwBtn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            padding: 0;
            background: #fff;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #loginBtn { color: var(--primary-color); }
        #loginBtn:hover {
            background-color: #f3f4f6;
            border-color: var(--primary-color);
        }

        #pwBtn { color: var(--text-muted); }
        #pwBtn:hover {
            background-color: #f3f4f6;
            border-color: #4b5563;
        }

        body.admin-mode #loginBtn {
            background-color: #fee2e2;
            border-color: #fca5a5;
            color: #ef4444;
        }

        /* 模式切換 Tabs */
        .mode-toggle-area {
            display: flex;
            background-color: #f1f3f0;
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        .mode-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            color: var(--text-muted);
            user-select: none;
        }

        .mode-tab.active {
            background-color: white;
            color: var(--primary-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* 學習成就看板 */
        .dashboard-area {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background-color: #fbfbfa;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stat-icon {
            font-size: 24px;
            background-color: #f1f3f0;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
        }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
        }

        /* 統一日期選擇區域 */
        .book-selector-area {
            background-color: #f5f6f3;
            padding: 18px 22px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            border: 1px solid #e2e5e1;
            border-left: 5px solid var(--primary-color);
        }

        .book-selector-area label {
            font-weight: bold;
            color: var(--primary-color);
            font-size: 15px;
        }

        .book-select {
            padding: 10px 14px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background-color: white;
            min-width: 250px;
            color: var(--text-color);
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* 功能控制 */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-bar {
            flex: 1;
            min-width: 220px;
            padding: 11px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background-color: white;
            transition: all 0.2s;
        }

        .search-bar:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(45, 90, 39, 0.08);
        }

        /* 按鈕風格 */
        .btn {
            padding: 10px 18px;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover { transform: translateY(-1px); }
        .btn-primary { background-color: var(--primary-color); }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: var(--success-color); }
        .btn-success:hover { background-color: var(--success-hover); }
        .btn-danger { background-color: var(--danger-color); }
        .btn-danger:hover { background-color: var(--danger-hover); }
        .btn-secondary { background-color: #4b5563; }
        .btn-secondary:hover { background-color: #374151; }
        .btn-warning { background-color: var(--warning-color); }
        .btn-warning:hover { background-color: var(--warning-hover); }
        .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 6px; }

        /* 教師專用控制 */
        .teacher-only { display: none !important; }
        body.admin-mode .teacher-only { display: inline-block !important; }
        body.admin-mode div.teacher-only { display: block !important; }
        body.admin-mode tr.teacher-only, body.admin-mode th.teacher-only, body.admin-mode td.teacher-only { display: table-cell !important; }

        /* 表單完全隔離 */
        body.admin-mode .form-section.teacher-only {
            display: none !important;
        }
        body.admin-mode .form-section.teacher-only.active {
            display: block !important;
        }

        /* 表單區域 */
        .form-section {
            background-color: #fbfbfa;
            padding: 22px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            display: none;
            animation: formAppear 0.2s ease-out;
        }

        @keyframes formAppear {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-row-item {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        /* 模式一：常規表格樣式 */
        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: white;
            animation: viewAppear 0.3s ease-out;
        }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: #f5f6f3; color: var(--primary-color); font-weight: 700; font-size: 14px; user-select: none; }
        tr:hover { background-color: #fafaf9; }

        .english-container { display: flex; align-items: center; gap: 12px; }
        .english-word-link { font-weight: 700; text-decoration: none; border-bottom: 1px solid #cbd5e1; padding-bottom: 1px; transition: all 0.2s; }
        .english-word-link:hover { opacity: 0.8; }
        
        /* 表格內特定的英文超連結樣式 */
        #vocabTable .english-word-link { color: #1e3a24; }
        #vocabTable .english-word-link:hover { color: var(--primary-color); border-bottom-color: var(--primary-color); }

        .btn-speak { background-color: #f1f3f0; color: var(--primary-color); border: none; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
        .btn-speak:hover { background-color: var(--primary-color); color: white; }
        .count-badge { background-color: #f1f3f0; color: var(--primary-color); padding: 3px 10px; border-radius: 12px; font-weight: 700; font-size: 13px; border: 1px solid #e2e5e1; }

        /* ==========================================
           模式二：詞組字卡「全置中極美防歪排版」
           ========================================== */
        .similar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px; 
            margin-top: 10px;
            animation: viewAppear 0.3s ease-out;
            align-items: stretch; /* 保留網格高度對齊 */
        }

        /* 外部大卡片 */
        .similar-card {
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow-subtle);
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* 緊湊對齊 */
            gap: 16px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        
        /* 卡片滑過微飄浮效果 */
        .similar-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(45, 90, 39, 0.08);
        }

        /* 卡片頂部配色定義 */
        .similar-card.type-相似字 { border-top: 4px solid var(--primary-color); }
        .similar-card.type-相似字 .similar-card-title { color: var(--primary-color); }
        .similar-card.type-相似字 .similar-type-badge { background-color: #eef0eb; color: var(--primary-color); }
        .similar-card.type-相似字 .english-word-link { color: var(--primary-color); border-bottom-color: #c5d7c0; }

        .similar-card.type-混淆字 { border-top: 4px solid var(--warning-color); }
        .similar-card.type-混淆字 .similar-card-title { color: var(--warning-color); }
        .similar-card.type-混淆字 .similar-type-badge { background-color: #fef3c7; color: var(--warning-color); }
        .similar-card.type-混淆字 .english-word-link { color: var(--warning-color); border-bottom-color: #fde68a; }

        .similar-card.type-關聯字 { border-top: 4px solid var(--accent-color); }
        .similar-card.type-關聯字 .similar-card-title { color: var(--accent-color); }
        .similar-card.type-關聯字 .similar-type-badge { background-color: #f3e8ff; color: var(--accent-color); }
        .similar-card.type-關聯字 .english-word-link { color: var(--accent-color); border-bottom-color: #ddd6fe; }

        /* 卡片標題與操控鈕 (全置中結構) */
        .similar-card-title {
            font-size: 16px;
            font-weight: 700;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--border-color);
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
            letter-spacing: -0.3px;
            width: 100%;
        }

        .similar-type-badge {
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px; /* 藥丸膠囊外觀 */
            letter-spacing: 0.5px;
            display: inline-block;
        }

        /* 單字行集合 */
        .similar-words-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        /* 置中紙質單字區塊 (Centered Inner word-box) */
        .similar-word-item {
            background-color: #faf9f6; /* 溫和紙張黃 */
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            text-align: center;  
            gap: 8px;
            position: relative;
            transition: all 0.2s;
            width: 100%; 
        }
        .similar-word-item:hover {
            background-color: #f5f4ef;
        }

        /* 單字行上層 (英文與中文垂直排列置中) */
        .similar-row-top {
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }

        .similar-word-left {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .similar-eng-text {
            font-size: 18px; 
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .similar-translation {
            font-weight: 700;
            color: var(--text-color);
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 4px 14px; /* 寬口膠囊樣式 */
            border-radius: 20px;
            border: 1px solid #eef0ec;
            display: inline-block;
            box-shadow: 0 1px 2px rgba(0,0,0,0.01);
            transition: all 0.2s;
        }

        /* 置中備註與聯想提示 */
        .similar-notes {
            font-size: 12px;
            color: var(--text-muted);
            background-color: transparent;
            padding-top: 8px;
            border-top: 1px dashed rgba(0, 0, 0, 0.05);
            margin-top: 4px;
            line-height: 1.4;
            width: 100%;
            max-width: 280px; 
            text-align: center;
            transition: all 0.2s;
        }

        /* ==========================================
           【超高質感隱藏中文遮罩】
           ========================================== */
        
        /* 模式一表格 */
        .hide-translation .chinese-cell span {
            color: transparent !important;
            background-color: #eef0eb !important;
            border-color: #eef0eb !important;
            box-shadow: none !important;
            cursor: pointer;
            user-select: none;
            border-radius: 4px;
            display: inline-block;
            min-width: 90px;
            transition: all 0.2s ease;
        }
        .hide-translation .chinese-cell span:hover {
            color: var(--text-color) !important;
            background-color: transparent !important;
        }

        /* 模式二卡片 */
        .hide-translation .similar-translation,
        .hide-translation .similar-notes {
            color: transparent !important;
            background-color: #eef0eb !important;
            border-color: transparent !important;
            box-shadow: none !important;
            cursor: pointer;
            user-select: none;
            border-radius: 4px;
            display: inline-block;
            min-width: 120px;
            transition: all 0.2s ease;
        }
        .hide-translation .similar-translation:hover,
        .hide-translation .similar-notes:hover {
            color: var(--text-color) !important;
            background-color: transparent !important;
            border-color: #eef0ec !important;
        }

        /* 3D 閃卡與彈窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .card-container { background: #fff; padding: 35px; border-radius: 16px; width: 90%; max-width: 420px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1); border: 1px solid var(--border-color); }
        .flashcard-wrapper { perspective: 1000px; margin: 25px auto; width: 100%; height: 170px; cursor: pointer; }
        .flashcard-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .flashcard-wrapper.flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; border: 1px dashed #cbd5e1; background-color: #fafaf7; background-image: radial-gradient(#e1e4e6 1px, transparent 0); background-size: 8px 8px; }
        .flashcard-front { color: var(--primary-color); }
        .flashcard-back { transform: rotateY(180deg); border-color: var(--primary-color); border-style: solid; }
        .card-english { font-size: 32px; font-weight: 800; color: #1e3a24; margin-bottom: 8px; }
        .card-chinese { font-size: 24px; font-weight: 700; color: var(--text-color); margin-bottom: 8px; }
        .card-notes { font-size: 14px; color: var(--text-muted); }

        .backup-section { margin-top: 25px; display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; }
        #fileInput { display: none; }

        @media (max-width: 600px) {
            .header-area { flex-direction: column; align-items: flex-start; }
            .controls { flex-direction: column; align-items: stretch; }
            th, td { padding: 12px; font-size: 14px; }
            .form-row-item { grid-template-columns: 1fr; gap: 5px; }
            .similar-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 頂部標題區 -->
    <div class="header-area">
        <h1>
            📚 我的英文單字學習本
            <span id="syncIndicator"></span>
        </h1>
        <div class="header-btn-group">
            <button id="pwBtn" class="teacher-only" onclick="changePassword()" title="修改密碼">⚙️</button>
            <button id="loginBtn" onclick="handleLoginToggle()" title="管理員登入">🔑</button>
        </div>
    </div>

    <!-- 模式切換器 -->
    <div class="mode-toggle-area">
        <div id="modeTabNormal" class="mode-tab active" onclick="switchSystemMode('normal')">📘 常規單字本</div>
        <div id="modeTabSimilar" class="mode-tab" onclick="switchSystemMode('similar')">🔍 相似/混淆字組</div>
    </div>

    <!-- 學習成就看板 -->
    <div class="dashboard-area">
        <div class="stat-card">
            <div class="stat-icon">📅</div>
            <div class="stat-info">
                <span class="stat-label">累積日期本</span>
                <span id="statBooks" class="stat-value">0</span>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">📝</div>
            <div class="stat-info">
                <span class="stat-label" id="statWordsLabel">當日單字量</span>
                <span id="statUniqueWords" class="stat-value">0</span>
            </div>
        </div>
    </div>

    <!-- 統一日期選擇區域 (共用日期筆記本) -->
    <div class="book-selector-area" id="bookSelectorArea">
        <label for="bookSelect">📅 選擇課堂日期：</label>
        <select id="bookSelect" class="book-select" onchange="switchBook()">
            <!-- 由 JS 動態產生 -->
        </select>
        <button class="btn btn-primary btn-sm teacher-only" onclick="createNewBook()">＋ 新增日期</button>
        <button id="deleteBookBtn" class="btn btn-danger btn-sm teacher-only" onclick="deleteCurrentBook()">🗑️ 刪除完整課堂</button>
    </div>

    <!-- 功能控制區 -->
    <div class="controls">
        <input type="text" id="searchInput" class="search-bar" placeholder="搜尋英文、中文或註記...">
        <button id="openFormBtn" class="btn btn-success teacher-only" onclick="toggleForm()">＋ 新增字組/單字</button>
        <button class="btn btn-warning" onclick="openQuiz()">🎯 進入隨機測驗</button>
        <button class="btn btn-secondary" onclick="toggleTranslation()">隱藏/顯示中文</button>
    </div>

    <!-- 模式一：常規單字本表單 -->
    <div id="vocabFormSection" class="form-section teacher-only">

<script>
    // =========================================================================
    // 🌐 雲端資料同步設定 (Cloud Sync Configuration)
    // -------------------------------------------------------------------------
    // 教師將導出的資料 (.json) 上傳至免費空間（如 GitHub Gist, Pastebin Raw 或是個人主機）
    // 並將該直連 Raw JSON 網址貼在下方雙引號中。
    // * 若此欄留空，網頁會自動切回讀取學生個人瀏覽器的本地快取。
    // =========================================================================
    const CLOUD_DATA_URL = "https://gist.githubusercontent.com/Jerryfish0126/8a5c35579215dcd86e62809f2cf4c955/raw/ad82fa323dd0a0b56cd0af1ce684170ad649abb1/vocab.json"; 

    // 預設一體化學習本示範資料
    const defaultUnifiedBooks = [
        {
            id: "book-8-7",
            name: "8/7 課堂學習本",
            words: [
                { english: 'verify', chinese: '證實、核對', notes: '常用於系統驗證' },
                { english: 'diligent', chinese: '勤奮的', notes: '形容詞，形容學習認真' }
            ],
            similarGroups: [
                {
                    id: "group-1",
                    type: "相似字",
                    words: [
                        { english: "recreation", chinese: "娛樂、消遣", notes: "概念較抽象" },
                        { english: "entertain", chinese: "招待、使歡樂", notes: "帶有動態演出的消遣" },
                        { english: "leisure", chinese: "閒暇、空閒", notes: "指無憂無慮的時間" }
                    ]
                }
            ]
        },
        {
            id: "book-8-9",
            name: "8/9 課堂學習本",
            words: [
                { english: 'implement', chinese: '實施、執行', notes: '專案常用開發術語' }
            ],
            similarGroups: [
                {
                    id: "group-2",
                    type: "混淆字",
                    words: [
                        { english: "device", chinese: "(小)裝置", notes: "如手機、手錶" },
                        { english: "machine", chinese: "(大)機器", notes: "指具備引擎的大型機具" }
                    ]
                }
            ]
        }
    ];

    let bookList = [];      
    let systemMode = "normal"; 
    let currentBookId = "";    
    let isAdmin = false;

    let currentSortColumn = 'english'; 
    let isSortAsc = true;           

    window.onload = async function() {
        // 1. 初始化密碼
        const currentPasswordInStorage = localStorage.getItem('adminPassword');
        if (!currentPasswordInStorage || currentPasswordInStorage === 'teacher123') {
            localStorage.setItem('adminPassword', '970126'); 
        }

        // 2. 嘗試自雲端讀取資料
        await loadData();

        // 3. 回填寫入端雲端設定 (僅限教師本地)
        initGistSettingsInForm();

        updateBookDropdown();
        renderActiveMode();
    };

    // ==========================================
    // 智慧型雲端/本地自動切換資料讀取引擎
    // ==========================================
    async function loadData() {
        if (CLOUD_DATA_URL && CLOUD_DATA_URL.trim() !== "" && CLOUD_DATA_URL !== "您的GitHub_Gist直連網址") {
            try {
                // 發起異步網絡請求
                const response = await fetch(CLOUD_DATA_URL);
                if (!response.ok) throw new Error("網路連線或檔案存取失敗");
                
                const cloudData = await response.json();
                if (Array.isArray(cloudData) && cloudData.length > 0) {
                    bookList = cloudData;
                    // 同步寫入本地快取，防止離線時無法複習
                    localStorage.setItem('myVocabBooks_v7_unified', JSON.stringify(bookList));
                    showSyncStatus(true);
                    
                    if (bookList.length > 0) {
                        currentBookId = bookList[0].id;
                    }
                    return;
                }
            } catch (error) {
                console.warn("❌ 雲端同步失敗，改為讀取本地快取資料:", error);
                showSyncStatus(false, "已載入本地備份資料");
            }
        }

        // 雲端不可用或無雲端配置，回退至讀取瀏覽器 LocalStorage
        const storedUnified = localStorage.getItem('myVocabBooks_v7_unified');
        if (storedUnified) {
            bookList = JSON.parse(storedUnified);
        } else {
            bookList = defaultUnifiedBooks;
            saveToLocalStorage();
        }

        if (bookList.length > 0) {
            currentBookId = bookList[0].id;
        }
    }

    function showSyncStatus(isOnline, customText) {
        const indicator = document.getElementById('syncIndicator');
        if (!indicator) return;
        indicator.style.display = 'inline-block';
        if (isOnline) {
            indicator.className = 'sync-badge-online';
            indicator.innerText = '🌐 雲端已同步';
        } else {
            indicator.className = 'sync-badge-offline';
            indicator.innerText = customText || '🔌 本地離線模式';
        }
    }

    function saveToLocalStorage() {
        localStorage.setItem('myVocabBooks_v7_unified', JSON.stringify(bookList));
        updateStats();
    }

    // ==========================================
    // ☁️ 全自動雲端儲存/寫入引擎 (僅管理員端執行)
    // ==========================================
    function initGistSettingsInForm() {
        const storedId = localStorage.getItem('gist_sync_id');
        const storedToken = localStorage.getItem('gist_sync_token');
        if (storedId) document.getElementById('gistIdInput').value = storedId;
        if (storedToken) document.getElementById('gistTokenInput').value = storedToken;
    }

    function saveGistSettings() {
        const gistId = document.getElementById('gistIdInput').value.trim();
        const token = document.getElementById('gistTokenInput').value.trim();
        if (!gistId || !token) {
            alert("請確實填入 Gist ID 與 Token 金鑰！");
            return;
        }
        localStorage.setItem('gist_sync_id', gistId);
        localStorage.setItem('gist_sync_token', token);
        alert("🔒 雲端自動化設定已安全儲存在您此台電腦！");
    }

    async function syncToCloud() {
        if (!isAdmin) return;
        const gistId = localStorage.getItem('gist_sync_id');
        const token = localStorage.getItem('gist_sync_token');

        if (!gistId || !token) {
            alert("請先在下方輸入並儲存您的 Gist ID 與 GitHub Token 金鑰！");
            return;
        }

        const syncBtn = document.getElementById('syncToCloudBtn');
        const originalText = syncBtn.innerText;
        syncBtn.innerText = "⏳ 正在全自動上傳雲端...";
        syncBtn.disabled = true;

        try {
            const response = await fetch(`https://api.github.com/gists/${gistId}`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    files: {
                        "vocab.json": {
                            content: JSON.stringify(bookList, null, 2)
                        }
                    }
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.message || "網路寫入請求失敗");
            }

            alert("🎉 【雲端同步完成】\n資料庫已全自動覆蓋更新，學生的手機、平板、電腦現在起都會讀取到最新單字！");
            // 同步完重新下載一次本地
            saveToLocalStorage();
        } catch (error) {
            alert("❌ 全自動同步失敗:\n" + error.message + "\n\n請確認您的 Gist ID 與 Token 是否正確，且 Token 在設定時勾選了 [gist] 權限。");
        } finally {
            syncBtn.innerText = originalText;
            syncBtn.disabled = false;
        }
    }

    // 模式切換
    function switchSystemMode(mode) {
        systemMode = mode;
        document.getElementById('modeTabNormal').classList.remove('active');
        document.getElementById('modeTabSimilar').classList.remove('active');
        
        document.getElementById('normalTableContainer').style.display = 'none';
        document.getElementById('similarGridContainer').style.display = 'none';

        toggleForm(false); 

        if (mode === 'normal') {
            document.getElementById('modeTabNormal').classList.add('active');
            document.getElementById('normalTableContainer').style.display = 'block';
        } else {
            document.getElementById('modeTabSimilar').classList.add('active');
            document.getElementById('similarGridContainer').style.display = 'grid';
        }

        updateBookDropdown(); 
        renderActiveMode();
    }

    function renderActiveMode() {
        const filterVal = document.getElementById('searchInput').value;
        if (systemMode === 'normal') {
            renderTable(filterVal);
        } else {
            renderSimilarTable(filterVal);
        }
        updateStats();
    }

    // ==========================================
    // 智慧型指標狀態動態切換計算 (當日單字量 vs 總單字量)
    // ==========================================
    function updateStats() {
        document.getElementById('statBooks').innerText = bookList.length;

        const statLabel = document.getElementById('statWordsLabel');
        const statValue = document.getElementById('statUniqueWords');

        if (systemMode === 'normal') {
            // 常規單字本模式
            if (currentBookId === "all-books-review") {
                statLabel.innerText = "總單字量";
                statValue.innerText = getAggregatedWords().length; // 跨模式去重總字彙量
            } else {
                statLabel.innerText = "當日單字量";
                statValue.innerText = getCurrentWords().length;    // 精準當日 Mode 1 單字量
            }
        } else {
            // 相似字本模式 (同步切換當日/總體指標)
            if (currentBookId === "all-books-review") {
                statLabel.innerText = "總字組數";
                let totalGroups = 0;
                bookList.forEach(b => totalGroups += (b.similarGroups || []).length);
                statValue.innerText = totalGroups;
            } else {
                statLabel.innerText = "當日字組數";
                const book = bookList.find(b => b.id === currentBookId);
                statValue.innerText = book ? (book.similarGroups || []).length : 0;
            }
        }
    }

    function updateBookDropdown() {
        const select = document.getElementById('bookSelect');
        select.innerHTML = '';
        bookList.forEach(book => {
            const opt = document.createElement('option');
            opt.value = book.id; opt.innerText = book.name;
            if (book.id === currentBookId) opt.selected = true;
            select.appendChild(opt);
        });

        const allOpt = document.createElement('option');
        allOpt.value = "all-books-review"; 
        allOpt.innerText = systemMode === 'normal' ? "📊 所有單字一覽 (自動累計次數)" : "📊 所有相似字組一覽";
        if (currentBookId === "all-books-review") allOpt.selected = true;
        select.appendChild(allOpt);

        const deleteBtn = document.getElementById('deleteBookBtn');
        const openFormBtn = document.getElementById('openFormBtn');
        if (currentBookId === "all-books-review") {
            if (deleteBtn) deleteBtn.style.display = "none";
            if (openFormBtn) openFormBtn.style.display = "none";
        } else {
            if (deleteBtn && isAdmin) deleteBtn.style.display = "inline-block";
            if (openFormBtn && isAdmin) openFormBtn.style.display = "inline-block";
        }
    }

    function switchBook() {
        currentBookId = document.getElementById('bookSelect').value;
        if (currentBookId === "all-books-review") {
            currentSortColumn = (systemMode === 'normal') ? 'count' : 'english'; 
            isSortAsc = false;
        } else {
            currentSortColumn = 'english'; isSortAsc = true;
        }
        updateBookDropdown();
        triggerTableLoadAnimation();
        renderActiveMode();
    }

    function triggerTableLoadAnimation() {
        const el = systemMode === 'normal' ? document.getElementById('normalTableContainer') : document.getElementById('similarGridContainer');
        if (el) {
            el.style.animation = 'none';
            el.offsetHeight; 
            el.style.animation = null;
        }
    }

    function createNewBook() {
        if (!isAdmin) return;
        const name = prompt("請輸入新的學習日期或主題名稱 (如: 8/14 課堂)：");
        if (name && name.trim() !== "") {
            const id = "book-" + Date.now();
            bookList.push({ id: id, name: name.trim(), words: [], similarGroups: [] });
            currentBookId = id;
            saveToLocalStorage();
            updateBookDropdown();
            renderActiveMode();
        }
    }

    // ==========================================
    // 智慧刪除邏輯：支援只刪除常規部分、相似字部分或刪除完整課堂
    // ==========================================
    function deleteCurrentBook() {
        if (!isAdmin || currentBookId === "all-books-review") return;
        const book = bookList.find(b => b.id === currentBookId);
        if (!book) return;

        const normalCount = (book.words || []).length;
        const similarCount = (book.similarGroups || []).length;

        // 當天若兩邊都為空，則直接刪除課堂
        if (normalCount === 0 && similarCount === 0) {
            if (confirm(`「${book.name}」目前無任何內容，是否將其完全刪除？`)) {
                performDeleteBook(book.id);
            }
            return;
        }

        // 引導用戶進行細緻化分部刪除
        const promptMsg = 
            `「${book.name}」內容清單：\n` +
            `• 常規單字：${normalCount} 筆\n` +
            `• 相似字組：${similarCount} 筆\n\n` +
            `請輸入對應的代號執行刪除：\n` +
            `[ 1 ] 只清除 常規單字部分\n` +
            `[ 2 ] 只清除 相似字組部分\n` +
            `[ 3 ] 完全刪除 整個課堂日期`;

        const choice = prompt(promptMsg);
        if (choice === null) return; // 取消操作

        const trimmedChoice = choice.trim();

        if (trimmedChoice === '1') {
            if (confirm(`確定要完全清除「${book.name}」的所有常規單字嗎？`)) {
                book.words = [];
                saveToLocalStorage();
                renderActiveMode();
                alert('常規單字部分已清除！');
            }

    // ==========================================
    // 模式一：一覽整合統計邏輯 (每日精準去重、防止重複累計)
    // ==========================================
    function getAggregatedWords() {
        const map = {};
        
        bookList.forEach(book => {
            const seenThisDay = new Set();
            const tempWordsData = {}; 
            
            // 1. 處理第一部分 (常規單字)
            (book.words || []).forEach(word => {
                const wordRaw = word.english.trim();
                const key = wordRaw.toLowerCase();
                seenThisDay.add(key);
                
                if (!tempWordsData[key]) {
                    tempWordsData[key] = {
                        english: wordRaw,
                        chineseList: [word.chinese.trim()],
                        notesList: word.notes ? [word.notes.trim()] : []
                    };
                } else {
                    if (!tempWordsData[key].chineseList.includes(word.chinese.trim())) {
                        tempWordsData[key].chineseList.push(word.chinese.trim());
                    }
                    if (word.notes && !tempWordsData[key].notesList.includes(word.notes.trim())) {
                        tempWordsData[key].notesList.push(word.notes.trim());
                    }
                }
            });

            // 2. 處理第二部分 (相似/混淆/關聯字組 - 移除主題參考，僅追蹤類型)
            (book.similarGroups || []).forEach(group => {
                (group.words || []).forEach(word => {
                    const wordRaw = word.english.trim();
                    const key = wordRaw.toLowerCase();
                    seenThisDay.add(key);

                    const sourceTag = `[${group.type || '相似字'}]${word.notes ? ' ' + word.notes.trim() : ''}`;
                    
                    if (!tempWordsData[key]) {
                        tempWordsData[key] = {
                            english: wordRaw,
                            chineseList: [word.chinese.trim()],
                            notesList: [sourceTag]
                        };
                    } else {
                        if (!tempWordsData[key].chineseList.includes(word.chinese.trim())) {
                            tempWordsData[key].chineseList.push(word.chinese.trim());
                        }
                        if (!tempWordsData[key].notesList.includes(sourceTag)) {
                            tempWordsData[key].notesList.push(sourceTag);
                        }
                    }
                });
            });

            // 3. 每日去重累加：同單字在同天不論在哪個本出現，至多累加 1 次出現天數
            seenThisDay.forEach(key => {
                const dayData = tempWordsData[key];
                if (!map[key]) {
                    map[key] = {
                        english: dayData.english,
                        chineseList: [...dayData.chineseList],
                        notesList: [...dayData.notesList],
                        count: 1
                    };
                } else {
                    map[key].count += 1; 
                    dayData.chineseList.forEach(chi => {
                        if (!map[key].chineseList.includes(chi)) map[key].chineseList.push(chi);
                    });
                    dayData.notesList.forEach(not => {
                        if (!map[key].notesList.includes(not)) map[key].notesList.push(not);
                    });
                }
            });
        });

        return Object.values(map).map(item => ({ 
            count: item.count, 
            english: item.english, 
            chinese: item.chineseList.join(' / '), 
            notes: item.notesList.join('; ') 
        }));
    }

        renderTableHeader();

        let displayList = currentWords.map((item, index) => {
            return { ...item, originalIndex: index };
        });

        displayList.sort((a, b) => {
            let valA = a[currentSortColumn] || 0;
            let valB = b[currentSortColumn] || 0;
            return typeof valA === 'string' ? (isSortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA)) : (isSortAsc ? valA - valB : valB - valA);
        });

        displayList.forEach((item) => {
            if (filterText) {

                if (!item.english.toLowerCase().includes(searchLower) && !item.chinese.toLowerCase().includes(searchLower)) return;

        if (!isAdmin || currentBookId === "all-books-review") return;

        const words = [];

            return;
        }

    // ==========================================
    // 批次字組解析器：只抓取 # 類別，略過任何主題文字
    // ==========================================
    function saveBatchSimilarGroups() {
        if (!isAdmin || currentBookId === "all-books-review") return;
        const rawText = document.getElementById('batchSimilarInput').value.trim();
        if (!rawText) {
            alert('請輸入要批次匯入的對比字組內容！');
            return;
        }

        const book = bookList.find(b => b.id === currentBookId);
        if (!book) return;

        const lines = rawText.split('\n');
        let currentGroup = null;
        let groupCount = 0;
        let wordCount = 0;

        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;

            if (trimmed.startsWith('#')) {
                if (currentGroup && currentGroup.words.length > 0) {
                    if (!book.similarGroups) book.similarGroups = [];
                    book.similarGroups.push(currentGroup);
                    groupCount++;
                }

                const headerContent = trimmed.replace(/^#\s*/, '').trim();
                let type = "相似字"; // 預設

                // 智慧判定類別
                if (headerContent.includes("混淆")) type = "混淆字";
                else if (headerContent.includes("關聯")) type = "關聯字";
                else if (headerContent.includes("相似")) type = "相似字";

                if (["相似字", "混淆字", "關聯字"].includes(headerContent)) {
                    type = headerContent;
                }

                currentGroup = {
                    id: "group-" + Date.now() + Math.random().toString(36).substr(2, 5),
                    type: type,
                    words: []
                };
            } else if (currentGroup) {
                const parts = trimmed.split(',');
                if (parts.length >= 2) {
                    const english = parts[0].trim();
                    const chinese = parts[1].trim();
                    const notes = parts[2] ? parts[2].trim() : '';
                    if (english && chinese) {
                        currentGroup.words.push({ english, chinese, notes });
                        wordCount++;
                    }
                }
            }
        });

        if (currentGroup && currentGroup.words.length > 0) {
            if (!book.similarGroups) book.similarGroups = [];
            book.similarGroups.push(currentGroup);
            groupCount++;
        }

        if (groupCount === 0) {
            alert('未成功解析出任何字組，請檢查格式是否包含以 # 類別 開頭！');
            return;
        }

        saveToLocalStorage();
        renderSimilarTable();
        document.getElementById('batchSimilarInput').value = '';
        toggleForm(false);
        alert(`成功新增 ${groupCount} 組對比字組 (共計 ${wordCount} 個單字) 至「${book.name}」！`);
    }

        const isSimActive = simForm.classList.contains('active');

        normForm.classList.remove('active');
        simForm.classList.remove('active');

        if (show === false) {
            return; 
        }

        if (systemMode === 'normal') {
            if (show === true) {
                normForm.classList.add('active');
            } else {
                if (!isNormActive) {
                    clearForm(); 
                    normForm.classList.add('active');

            }
        } else {

            } else {

                    simForm.classList.add('active');
                }
            }
        }

            document.getElementById('quizModalTitle').innerText = "🎯 常規單字隨機測驗";
        } else {
            activeQuizPool = [];
            const currentGroups = getCurrentSimilarGroups();
            currentGroups.forEach(g => {
                g.words.forEach(w => activeQuizPool.push({ ...w, notes: `[類型: ${g.type || '相似字'}] ${w.notes || ''}` }));
            });
            document.getElementById('quizModalTitle').innerText = "🎯 相似字混合隨機測驗";
        }

        if (activeQuizPool.length === 0) {
            alert("當前範圍內沒有單字可供測驗。");
            return;
        }
        document.getElementById('quizModal').classList.add('active');
        nextQuiz();
    }

    function closeQuiz() { document.getElementById('quizModal').classList.remove('active'); }
    function flipCard() { document.getElementById('flashcardWrapper').classList.toggle('flipped'); }

    function nextQuiz() {
        if (activeQuizPool.length === 0) return;
        const randomIndex = Math.floor(Math.random() * activeQuizPool.length);
        currentQuizWord = activeQuizPool[randomIndex];

        document.getElementById('flashcardWrapper').classList.remove('flipped');
        setTimeout(() => {
            document.getElementById('cardEnglish').innerText = currentQuizWord.english;
            document.getElementById('cardChinese').innerText = currentQuizWord.chinese;
            document.getElementById('cardNotes').innerText = currentQuizWord.notes || "(無備註)";
        }, 150);
    }

    function speakCurrentQuiz() { if (currentQuizWord) speak(currentQuizWord.english); }

    function toggleTranslation() {
        const table = document.getElementById('vocabTable');
        const grid = document.getElementById('similarGridContainer');
        table.classList.toggle('hide-translation');
        grid.classList.toggle('hide-translation');
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
        if (systemMode === 'normal') {
            renderTable(e.target.value);
        } else {
            renderSimilarTable(e.target.value);
        }
    });

    function exportData() {
        if (!isAdmin) return;
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(bookList, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "all_vocab_system_backup.json");
        document.body.appendChild(downloadAnchor); downloadAnchor.click(); downloadAnchor.remove();
    }

    function importData(event) {
        if (!isAdmin) return;
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (Array.isArray(imported) && imported.length > 0 && imported[0].hasOwnProperty('words')) {
                    if (confirm('匯入將會完整覆蓋目前所有日期單字與相似字，確定覆蓋嗎？')) {
                        bookList = imported;
                        if (bookList.length > 0) currentBookId = bookList[0].id;
                        saveToLocalStorage();
                        updateBookDropdown();
                        renderActiveMode();
                        alert('整合系統資料還原成功！');
                    }
                } else {
                    alert('資料格式不正確，需為整合型備份檔案。');
                }
            } catch (err) { alert('檔案解析失敗。'); }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function escapeHTML(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // 安全轉義 JS 字串
    function escapeJS(str) {
        return str.replace(/'/g, "\\'");
    }
</script>

</body>
</html>
